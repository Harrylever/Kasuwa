# Railway — worker service (per use-railway skill)

# Worker deploys from this repo with its own service root.
# Option A (recommended): separate Railway service with Root Directory = apps/worker.
# Option B: monorepo service using the root Dockerfile.worker below.

[build]
builder = "DOCKERFILE"
dockerfile = "Dockerfile.worker"

[deploy]
startCommand = "bun src/index.ts"
restartPolicyType = "ON_FAILURE"
